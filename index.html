<style>

-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat,.card{background:var(--s);border:1px solid var(--l);border-radius:var(--r);box-shadow:0 12px 35px #10231c08}.stat{padding:15px}.stat small{color:var(--m)}.stat b{display:block;font-size:24px;margin:6px 0 1px}.stat span{font-size:11px;color:var(--gd);font-weight:700}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}.card{padding:18px;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:start;margin-bottom:14px}.head h3{margin:0;font-size:17px}.head p{margin:3px 0;color:var(--m);font-size:11px}.link{border:0;background:transparent;color:var(--gd);font-weight:750;font-size:12px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.q{border:1px solid var(--l);background:var(--s2);border-radius:15px;padding:13px;text-align:left}.q:hover{border-color:#a9d7c5}.q i{font-style:normal;font-size:19px}.q b{display:block;margin-top:7px}.q small{color:var(--m)}.item{border:1px solid var(--l);background:var(--s2);border-radius:13px;padding:11px;margin:7px 0}.row{display:flex;align-items:center;gap:10px}.ico{width:35px;height:35px;border-radius:11px;background:#e5f6ef;display:grid;place-items:center;color:var(--gd)}.grow{flex:1;min-width:0}.name{font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:11px;color:var(--m);margin-top:2px}.pill{font-size:10px;padding:5px 8px;background:#edf2ef;border-radius:99px}.progress{height:7px;background:#e7efeb;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#18a36f,#2bc98b)}.moneygrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.account{border:1px solid var(--l);border-radius:15px;padding:13px;background:var(--s2)}.account b{font-size:11px}.account small{display:block;color:var(--m);margin-top:4px}.account strong{display:block;font-size:20px;margin-top:8px}.notice{background:#eaf7f1;border:1px solid #cce9dc;border-radius:13px;padding:11px;font-size:11px;color:#2c654f;margin-top:10px}.mobile{display:none}

</head><body><aside class="side"><div class="logo"><div class="mark">🌿</div><div><b>Lifestyle OS</b><small>Personal life system</small></div></div><div class="label">Mon espace</div><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><div><h1 id="title">Bonjour 👋</h1><p id="sub">Ton cockpit personnel.</p></div><div class="avatar">A</div></div><div id="page"></div></main><nav class="mobile" id="mob"></nav>
<script>
const S=[["Accueil","⌂"],["Tâches","✓"],["Objectifs","◎"],["Agenda","◷"],["Finances","€"],["Carrière","▣"],["Santé","♥"],["Loisirs","◇"],["Vie sociale","♧"],["Spiritualité","✦"],["Documents","▤"]];
const K="LifestyleOS_Premium_V2";let d=JSON.parse(localStorage.getItem(K)||'{"tasks":[],"goals":[],"events":[],"finance":{"salary":969,"other":150,"bred":600,"revolut":519,"expenses":[],"investments":[]},"sport":{"weight":95,"target":85,"workouts":[]},"leisure":{"activities":[],"goals":[]},"social":{"contacts":[],"interactions":[]},"spiritual":{"sessions":[],"minutesWeek":0,"daysWeek":0,"intention":"","theme":""},"files":[]}');
d.tasks??=[];d.goals??=[];d.events??=[];d.files??=[];d.finance??={salary:969,other:150,bred:600,revolut:519,expenses:[],investments:[]};d.finance.expenses??=[];d.finance.investments??=[];d.sport??={weight:95,target:85,workouts:[]};d.sport.workouts??=[];d.leisure??={activities:[],goals:[]};d.leisure.activities??=[];d.leisure.goals??=[];d.social??={contacts:[],interactions:[]};d.social.contacts??=[];d.social.interactions??=[];d.spiritual??={sessions:[],goals:[],minutesWeek:0,daysWeek:0,intention:"",theme:""};d.spiritual.sessions??=[];
const $=x=>document.getElementById(x),esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));function save(){localStorage.setItem(K,JSON.stringify(d))}function euro(x){return (+x||0).toLocaleString("fr-FR",{minimumFractionDigits:2})+" €"}function exp(){return d.finance.expenses.reduce((a,x)=>a+(+x.amount||0),0)}
S.forEach(([n,i])=>{let b=document.createElement("button");b.innerHTML=`<i>${i}</i><span>${n}</span>`;b.onclick=()=>show(n);$("nav").appendChild(b);let m=b.cloneNode(true);m.onclick=()=>show(n);$("mob").appendChild(m)});
function act(s){document.querySelectorAll(".nav button,.mobile button").forEach(b=>b.classList.toggle("active",b.textContent.includes(s)))}function stats(){return `<div class="stats"><div class="stat"><small>À FAIRE</small><b>${d.tasks.filter(x=>!x.done).length}</b><span>Tâches actives</span></div><div class="stat"><small>OBJECTIFS</small><b>${d.goals.length}</b><span>En cours</span></div><div class="stat"><small>AGENDA</small><b>${d.events.length}</b><span>Événements</span></div><div class="stat"><small>REVENUS</small><b>${euro(d.finance.salary+d.finance.other)}</b><span>Mensuels</span></div></div>`}
function show(s){act(s);$("title").textContent=s==="Accueil"?"Bonjour 👋":s;$("sub").textContent=s==="Accueil"?"Ton cockpit personnel.":"Ton espace "+s.toLowerCase()+".";if(s==="Accueil")home();else if(s==="Tâches")tasks();else if(s==="Objectifs")goals();else if(s==="Agenda")agenda();else if(s==="Finances")finance();else if(s==="Santé")sport();else if(s==="Loisirs")leisure();else if(s==="Vie sociale")social();else if(s==="Spiritualité")spiritual();else documents()}
function home(){$("page").innerHTML=`<section class="hero"><div><h2>Ton Life Dashboard, enfin réuni.</h2><p>Un cockpit personnel pour piloter tes objectifs, ton temps, tes finances, ton sport et les domaines importants de ta vie.</p></div><div><button class="light" onclick="show('Tâches')">+ Nouvelle tâche</button> <button class="ghost" onclick="show('Objectifs')">Objectifs</button></div></section>${stats()}<div class="layout"><div><div class="card"><div class="head"><div><h3>Accès rapides</h3><p>Tes espaces Lifestyle OS</p></div></div><div class="quick">${S.slice(1,10).map(x=>`<button class="q" onclick="show('${x[0]}')"><i>${x[1]}</i><b>${x[0]}</b><small>Ouvrir</small></button>`).join("")}</div></div><div class="card"><div class="head"><div><h3>À faire maintenant</h3><p>Les prochaines actions</p></div><button class="link" onclick="show('Tâches')">Tout voir</button></div>${d.tasks.filter(x=>!x.done).slice(0,5).map(x=>`<div class="item"><div class="row"><div class="ico">✓</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.space||"Général")}</div></div><span class="pill">Active</span></div></div>`).join("")||'<div class="empty">Aucune tâche en attente 🎉</div>'}</div></div><div><div class="card"><div class="head"><div><h3>Finances</h3><p>Vue rapide</p></div><button class="link" onclick="show('Finances')">Ouvrir</button></div><div class="moneygrid"><div class="account"><b>BRED</b><small>Charges & réserve</small><strong>${euro(d.finance.bred)}</strong></div><div class="account"><b>REVOLUT</b><small>Quotidien</small><strong>${euro(d.finance.revolut)}</strong></div></div><div class="notice">Dépenses : <b>${euro(exp())}</b><br>Investissements : <b>${euro(d.finance.investments.reduce((a,x)=>a+(+x.amount||0),0))}</b></div></div><div class="card"><div class="head"><div><h3>Objectifs</h3><p>Progression</p></div></div>${d.goals.slice(0,4).map(x=>`<div class="item"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.space||"Général")} · ${x.progress||0}%</div><div class="progress"><i style="width:${x.progress||0}%"></i></div></div>`).join("")||'<div class="empty">Crée ton premier objectif.</div>'}</div></div></div>`}
function tasks(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Nouvelle tâche</h3><p class="sub">Ajoute une action.</p><div class="form-grid"><div class="field"><label>Tâche</label><input id="tn" placeholder="Ex. Envoyer un dossier"></div><div class="field"><label>Volet</label><select id="ts">${S.slice(4,10).map(x=>`<option>${x[0]}</option>`).join("")}</select></div></div><button class="primary" style="margin-top:10px" onclick="addT()">Ajouter</button></div><div class="card"><h3>Mes tâches</h3>${d.tasks.map(x=>`<div class="item"><div class="row"><div class="ico">✓</div><div class="grow"><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.space||"Général")} · ${x.done?"Terminée":"À faire"}</div></div></div><div class="actions"><button class="soft" onclick="tog('${x.id}')">${x.done?"Rouvrir":"Terminer"}</button><button class="danger" onclick="rmT('${x.id}')">Supprimer</button></div></div>`).join("")||'<div class="empty">Aucune tâche.</div>'}</div></div>`}
function addT(){let n=$("tn").value.trim();if(!n)return;d.tasks.unshift({id:crypto.randomUUID(),name:n,space:$("ts").value,done:false});save();tasks()}function tog(id){let x=d.tasks.find(a=>a.id===id);if(x)x.done=!x.done;save();tasks()}function rmT(id){d.tasks=d.tasks.filter(x=>x.id!==id);save();tasks()}
function goals(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Nouvel objectif</h3><p class="sub">Un objectif clair, une progression visible.</p><input id="gn" class="search" placeholder="Ex. Atteindre mon objectif"><select id="gs" class="search">${S.slice(4,10).map(x=>`<option>${x[0]}</option>`).join("")}</select><button class="primary" onclick="addG()">Créer l'objectif</button></div><div class="card"><h3>Mes objectifs</h3>${d.goals.map(x=>`<div class="item"><b>◎ ${esc(x.name)}</b><div class="meta">${esc(x.space||"Général")} · ${x.progress||0}%</div><div class="progress"><i style="width:${x.progress||0}%"></i></div><div class="actions"><button class="soft" onclick="upG('${x.id}')">+10%</button></div></div>`).join("")||'<div class="empty">Aucun objectif.</div>'}</div></div>`}
function addG(){let n=$("gn").value.trim();if(!n)return;d.goals.unshift({id:crypto.randomUUID(),name:n,space:$("gs").value,progress:0});save();goals()}function upG(id){let x=d.goals.find(a=>a.id===id);if(x)x.progress=Math.min(100,(x.progress||0)+10);save();goals()}
function agenda(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Nouvel événement</h3><input id="en" class="search" placeholder="Nom"><input id="ed" class="search" type="date"><select id="es" class="search">${S.slice(4,10).map(x=>`<option>${x[0]}</option>`).join("")}</select><button class="primary" onclick="addE()">Ajouter</button></div><div class="card"><h3>Agenda</h3>${d.events.map(x=>`<div class="item"><b>◷ ${esc(x.name)}</b><div class="meta">${esc(x.date)} · ${esc(x.space)}</div></div>`).join("")||'<div class="empty">Agenda vide.</div>'}</div></div>`}
function addE(){let n=$("en").value.trim(),date=$("ed").value;if(!n||!date)return;d.events.push({id:crypto.randomUUID(),name:n,date,space:$("es").value});save();agenda()}
function finance(){$("page").innerHTML=stats()+`<div class="layout"><div><div class="card"><h3>Comptes</h3><div class="moneygrid"><div class="account"><b>BRED</b><small>Charges & réserve</small><strong>${euro(d.finance.bred)}</strong></div><div class="account"><b>REVOLUT</b><small>Dépenses & investissement</small><strong>${euro(d.finance.revolut)}</strong></div></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Salaire</label><input id="fs" type="number" value="${d.finance.salary}"></div><div class="field"><label>Autres revenus</label><input id="fo" type="number" value="${d.finance.other}"></div><div class="field"><label>BRED</label><input id="fb" type="number" value="${d.finance.bred}"></div><div class="field"><label>Revolut</label><input id="fr" type="number" value="${d.finance.revolut}"></div></div><button class="primary" style="margin-top:10px" onclick="saveF()">Enregistrer</button></div><div class="card"><h3>Ajouter une dépense</h3><div class="form-grid"><div class="field"><label>Nom</label><input id="dn"></div><div class="field"><label>Montant</label><input id="da" type="number"></div><div class="field"><label>Catégorie</label><select id="dc"><option>Loyer</option><option>Assurance voiture</option><option>Crédit voiture</option><option>Salle de sport</option><option>Amazon</option><option>Livret A</option><option>Carburant</option><option>Courses</option><option>Frais bancaires</option><option>Autres dépenses</option></select></div></div><button class="primary" style="margin-top:10px" onclick="addF()">Ajouter</button></div></div><div class="card"><h3>Résumé</h3><div class="notice">Revenus : <b>${euro(d.finance.salary+d.finance.other)}</b><br>Dépenses : <b>${euro(exp())}</b><br>Reste théorique : <b>${euro(d.finance.salary+d.finance.other-exp())}</b></div>${d.finance.expenses.slice(0,10).map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="meta">${esc(x.category)} · ${euro(x.amount)}</div></div>`).join("")||'<div class="empty">Aucune dépense.</div>'}</div></div>`}
function saveF(){d.finance.salary=+$("fs").value;d.finance.other=+$("fo").value;d.finance.bred=+$("fb").value;d.finance.revolut=+$("fr").value;save();finance()}function addF(){let n=$("dn").value,a=+$("da").value;if(!n||!a)return;d.finance.expenses.unshift({id:crypto.randomUUID(),name:n,amount:a,category:$("dc").value});save();finance()}
function sport(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Objectifs physiques</h3><p class="sub">Poids, mesures et fréquence.</p><div class="form-grid"><div class="field"><label>Poids actuel kg</label><input id="sw" type="number" value="${d.sport.weight}"></div><div class="field"><label>Poids cible kg</label><input id="st" type="number" value="${d.sport.target}"></div><div class="field"><label>Tour de taille cm</label><input id="wa" type="number" value="${d.sport.waist||0}"></div><div class="field"><label>Poitrine cm</label><input id="ch" type="number" value="${d.sport.chest||0}"></div></div><button class="primary" style="margin-top:10px" onclick="saveS()">Enregistrer</button></div><div class="card"><h3>Nouvelle séance</h3><select id="sp" class="search"><option>Musculation</option><option>Muay Thai</option><option>Kayak</option><option>Course</option><option>Marche</option><option>Vélo</option><option>Natation</option><option>Autre</option></select><input id="du" class="search" type="number" placeholder="Durée en minutes"><button class="primary" onclick="addS()">Ajouter</button><h3 style="margin-top:20px">Historique</h3>${d.sport.workouts.map(x=>`<div class="item"><b>♥ ${esc(x.sport)}</b><div class="meta">${x.duration} min</div></div>`).join("")||'<div class="empty">Aucune séance.</div>'}</div></div>`}
function saveS(){d.sport.weight=+$("sw").value;d.sport.target=+$("st").value;d.sport.waist=+$("wa").value;d.sport.chest=+$("ch").value;save();sport()}function addS(){let m=+$("du").value;if(!m)return;d.sport.workouts.unshift({id:crypto.randomUUID(),sport:$("sp").value,duration:m});save();sport()}
function leisure(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Loisirs & passions</h3><p class="sub">Kayak, Muay Thai, guitare, moto, voyages…</p><input id="ln" class="search" placeholder="Activité / projet"><select id="lt" class="search"><option>Kayak</option><option>Muay Thai</option><option>Guitare</option><option>Moto</option><option>Voyage</option><option>Activité extrême</option><option>Randonnée</option><option>Autre</option></select><button class="primary" onclick="addL()">Ajouter</button>${d.leisure.activities.map(x=>`<div class="item"><b>◇ ${esc(x.name)}</b><div class="meta">${esc(x.type)}</div></div>`).join("")||'<div class="empty">Aucune activité.</div>'}</div><div class="card"><h3>Objectifs loisirs</h3><input id="lg" class="search" placeholder="Ex. Permis moto"><button class="primary" onclick="addLG()">Ajouter</button>${d.leisure.goals.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="meta">${x.progress||0}%</div><div class="progress"><i style="width:${x.progress||0}%"></i></div><button class="soft" onclick="upLG('${x.id}')">+10%</button></div>`).join("")||'<div class="empty">Aucun objectif.</div>'}</div></div>`}
function addL(){let n=$("ln").value.trim();if(!n)return;d.leisure.activities.unshift({id:crypto.randomUUID(),name:n,type:$("lt").value});save();leisure()}function addLG(){let n=$("lg").value.trim();if(!n)return;d.leisure.goals.push({id:crypto.randomUUID(),name:n,progress:0});save();leisure()}function upLG(id){let x=d.leisure.goals.find(a=>a.id===id);x.progress=Math.min(100,(x.progress||0)+10);save();leisure()}
function social(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Contacts</h3><input id="cn" class="search" placeholder="Nom"><select id="ct" class="search"><option>Famille</option><option>Amis</option><option>Connaissance</option><option>Collègue</option><option>Nouvelle rencontre</option></select><button class="primary" onclick="addC()">Ajouter</button>${d.social.contacts.map(x=>`<div class="item"><b>♧ ${esc(x.name)}</b><div class="meta">${esc(x.type)}</div></div>`).join("")||'<div class="empty">Aucun contact.</div>'}</div><div class="card"><h3>Interactions</h3><input id="si" class="search" placeholder="Ex. Appel avec un proche"><select id="sit" class="search"><option>Appel</option><option>Message</option><option>Sortie</option><option>Repas</option><option>Visite</option><option>Activité</option></select><button class="primary" onclick="addI()">Ajouter</button>${d.social.interactions.map(x=>`<div class="item"><b>${esc(x.type)}</b><div class="meta">${esc(x.name)}</div></div>`).join("")||'<div class="empty">Aucune interaction.</div>'}</div></div>`}
function addC(){let n=$("cn").value.trim();if(!n)return;d.social.contacts.push({id:crypto.randomUUID(),name:n,type:$("ct").value});save();social()}function addI(){let n=$("si").value.trim();if(!n)return;d.social.interactions.unshift({id:crypto.randomUUID(),name:n,type:$("sit").value});save();social()}
function spiritual(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Relation avec Dieu</h3><p class="sub">Un espace personnel, calme et simple.</p><div class="form-grid"><div class="field"><label>Minutes / semaine</label><input id="pm" type="number" value="${d.spiritual.minutesWeek}"></div><div class="field"><label>Jours / semaine</label><input id="pd" type="number" value="${d.spiritual.daysWeek}"></div></div><div class="field" style="margin-top:10px"><label>Intention actuelle</label><textarea id="pi">${esc(d.spiritual.intention)}</textarea></div><div class="field" style="margin-top:10px"><label>Passage / thème</label><textarea id="pt">${esc(d.spiritual.theme)}</textarea></div><button class="primary" style="margin-top:10px" onclick="saveP()">Enregistrer</button></div><div class="card"><h3>Sessions</h3><select id="pst" class="search"><option>Prière</option><option>Lecture de la Bible</option><option>Méditation</option><option>Gratitude</option><option>Réflexion</option><option>Église / communauté</option></select><input id="psm" class="search" type="number" placeholder="Durée en minutes"><button class="primary" onclick="addP()">Ajouter</button>${d.spiritual.sessions.map(x=>`<div class="item"><b>✦ ${esc(x.type)}</b><div class="meta">${x.minutes} min</div></div>`).join("")||'<div class="empty">Aucune session.</div>'}</div></div>`}
function saveP(){d.spiritual.minutesWeek=+$("pm").value;d.spiritual.daysWeek=+$("pd").value;d.spiritual.intention=$("pi").value;d.spiritual.theme=$("pt").value;save();spiritual()}function addP(){let m=+$("psm").value;if(!m)return;d.spiritual.sessions.unshift({id:crypto.randomUUID(),type:$("pst").value,minutes:m});save();spiritual()}
function documents(){$("page").innerHTML=stats()+`<div class="grid"><div class="card"><h3>Ajouter des fichiers</h3><p class="sub">Chaque fichier peut être classé par volet.</p><select id="fsp" class="search">${S.slice(1).map(x=>`<option>${x[0]}</option>`).join("")}</select><input id="fl" class="search" placeholder="Libellé"><input id="fi" type="file" multiple style="margin:10px 0"><br><button class="primary" onclick="addFiles()">Ajouter</button></div><div class="card"><div class="head"><div><h3>Bibliothèque</h3><p>${d.files.length} fichier(s)</p></div></div><input id="fq" class="search" placeholder="Rechercher"><div id="flist"></div></div></div>`;$("fq").oninput=listFiles;listFiles()}
function listFiles(){let q=($("fq")?.value||"").toLowerCase();let a=d.files.filter(x=>(x.name+" "+x.label+" "+x.space).toLowerCase().includes(q));$("flist").innerHTML=a.map(x=>`<div class="item"><div class="row"><div class="ico">▤</div><div class="grow"><div class="name">${esc(x.label||x.name)}</div><div class="meta">${esc(x.name)} · ${esc(x.space)}</div></div><button class="soft" onclick="openFile('${x.id}')">Ouvrir</button></div></div>`).join("")||'<div class="empty">Aucun fichier.</div>'}
function addFiles(){let fs=$("fi").files;if(!fs.length)return;let left=fs.length;[...fs].forEach(file=>{let r=new FileReader();r.onload=()=>{d.files.unshift({id:crypto.randomUUID(),name:file.name,label:$("fl").value||file.name,space:$("fsp").value,data:r.result});if(!--left){save();documents()}};r.readAsDataURL(file)})}function openFile(id){let x=d.files.find(a=>a.id===id);if(!x)return;let a=document.createElement("a");a.href=x.data;a.target="_blank";a.download=x.name;a.click()}
function toggleTheme(){document.body.classList.toggle("dark");localStorage.setItem("LifestyleOSTheme",document.body.classList.contains("dark")?"dark":"light")}if(localStorage.getItem("LifestyleOSTheme")==="dark")document.body.classList.add("dark");
show("Accueil");
</script></body></html>
