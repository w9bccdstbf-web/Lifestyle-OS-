<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Lifestyle OS — Premium</title>
<style>
:root{
  --bg:#07110e;--bg2:#0a1713;--panel:#0e1d18;--panel2:#12251e;
  --line:#203a30;--text:#f2faf6;--muted:#8fa89e;--green:#35d69a;
  --green2:#19a976;--soft:#14382b;--gold:#f3cf68;--red:#ff7888;
  --shadow:0 18px 55px rgba(0,0,0,.30);--r:24px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:
 radial-gradient(circle at 78% -5%,rgba(53,214,154,.12),transparent 28%),
 linear-gradient(180deg,#07110e 0%,#091612 100%);
 color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
 min-height:100vh;letter-spacing:-.01em}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh}
.sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;width:252px;padding:22px 14px;background:rgba(7,17,14,.88);backdrop-filter:blur(22px);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 28px}
.leaf{width:42px;height:42px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#37e3a3,#14835c);box-shadow:0 10px 30px rgba(53,214,154,.2)}
.leaf svg{width:24px}.brand b{display:block;font-size:18px}.brand small{display:block;color:var(--muted);margin-top:2px;font-size:11px}
.nav-title{padding:0 12px 8px;color:#638074;text-transform:uppercase;font-size:10px;letter-spacing:.14em}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 13px;border:1px solid transparent;border-radius:15px;background:transparent;color:#a9bdb4;text-align:left}
.nav button:hover{background:#10251d;color:#eaf8f2}.nav button.active{background:linear-gradient(100deg,#15372b,#10261f);border-color:#24513f;color:#fff;box-shadow:inset 3px 0 var(--green)}
.nav svg{width:19px;height:19px;flex:none}.sidebar-bottom{position:absolute;bottom:22px;left:20px;right:20px;color:#60786f;font-size:11px}
.main{margin-left:252px;padding:24px 30px 50px;max-width:1500px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.topbar h1{font-size:25px;margin:0}.topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}
.actions{display:flex;gap:9px;align-items:center}
.iconbtn,.datebtn{border:1px solid var(--line);background:#0d1c17;color:#dcece6;border-radius:14px;height:42px;padding:0 13px;display:flex;align-items:center;gap:8px}
.iconbtn{width:42px;justify-content:center}.iconbtn svg{width:19px}
.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#dffbef,#9cecc9);color:#07583f;font-weight:800}
.hero{position:relative;overflow:hidden;min-height:245px;padding:30px;border:1px solid #275443;border-radius:30px;
 background:linear-gradient(135deg,#0c231a 0%,#103d2e 60%,#0d2a20 100%);box-shadow:var(--shadow);margin-bottom:16px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero:before{width:320px;height:320px;right:-90px;top:-140px;background:radial-gradient(circle,rgba(53,214,154,.25),transparent 67%)}
.hero:after{width:220px;height:220px;right:120px;bottom:-160px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%)}
.hero-content{position:relative;z-index:1;max-width:700px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#7ee5bd;font-weight:700}
.hero h2{font-size:clamp(28px,4vw,44px);line-height:1.03;margin:10px 0 11px;max-width:650px}
.hero h2 span{color:var(--green)}
.hero p{color:#bdd1c8;line-height:1.55;max-width:650px;margin:0}
.hero-actions{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap}
.primary,.secondary{border-radius:14px;padding:11px 15px;border:1px solid transparent;font-weight:750}
.primary{background:var(--green);color:#052218;box-shadow:0 10px 25px rgba(53,214,154,.18)}
.secondary{background:#ffffff0d;border-color:#ffffff22;color:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:linear-gradient(180deg,#0e2019,#0b1a15);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.stat .mini{display:flex;justify-content:space-between;color:#789187;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.stat strong{display:block;font-size:26px;margin:8px 0 2px}.stat span{color:var(--green);font-size:11px;font-weight:700}
.columns{display:grid;grid-template-columns:1.45fr .8fr;gap:16px}.stack{display:grid;gap:16px}
.card{background:linear-gradient(180deg,rgba(14,29,24,.96),rgba(10,22,18,.96));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.card-head h3{margin:0;font-size:17px}.card-head p{margin:4px 0 0;color:var(--muted);font-size:11px}
.link{border:0;background:transparent;color:var(--green);font-size:12px;font-weight:750}
.task{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid #193229}.task:first-of-type{border-top:0}
.check{width:22px;height:22px;border:1px solid #4e7566;background:#0b1915;border-radius:7px;display:grid;place-items:center;color:#062419;flex:none}
.check.done{background:var(--green);border-color:var(--green)}.task.done .task-name{text-decoration:line-through;color:#6e837b}
.task-name{font-weight:650}.task-meta{font-size:10px;color:var(--muted);margin-top:3px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{min-height:82px;text-align:left;padding:12px;border-radius:17px;border:1px solid var(--line);background:#0b1915;color:#fff}.quick button:hover{border-color:#32715a;transform:translateY(-1px)}
.qicon{width:29px;height:29px;border-radius:10px;display:grid;place-items:center;background:#12382a;color:var(--green);margin-bottom:8px}.qicon svg{width:16px}.quick b{display:block;font-size:12px}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.progress{height:8px;background:#172c24;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#1aa976,#55e0ac)}
.goal{padding:12px 0;border-top:1px solid #193229}.goal:first-of-type{border-top:0}.goal-top{display:flex;justify-content:space-between;gap:10px}.goal b{font-size:12px}.goal small{color:var(--muted);font-size:10px}.goal .progress{margin-top:8px}
.finance-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid #193229}.finance-line:first-of-type{border-top:0}.finance-line span{color:var(--muted);font-size:11px}.finance-line strong{font-size:14px}.positive{color:var(--green)}.negative{color:var(--red)}
.focus{background:linear-gradient(135deg,#102c21,#0d201a);border-color:#275a45}.focus-row{display:flex;align-items:center;justify-content:space-between;gap:15px}.focus h3{margin:0 0 5px}.focus p{margin:0;color:var(--muted);font-size:11px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.chip{border:1px solid #2a4c3e;background:#0b1915;color:#d8e9e2;padding:8px 11px;border-radius:99px;font-size:11px}
.quote{padding:15px;border-radius:16px;background:#0a1915;border:1px solid #1d362c;color:#b9cbc4;font-style:italic;line-height:1.5;font-size:12px}
.page-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.field input,.field select,.field textarea,.search{width:100%;background:#091712;color:#eef8f4;border:1px solid #234136;border-radius:13px;padding:11px 12px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:#42c997;box-shadow:0 0 0 3px #35d69a14}
.form-actions{display:flex;gap:8px;margin-top:10px}.empty{padding:20px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed #29453a;border-radius:15px}
.list-item{padding:12px;border:1px solid var(--line);background:#0a1915;border-radius:15px;margin-top:8px}.list-item .row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list-item small{color:var(--muted)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calhead{text-align:center;color:#70867d;font-size:9px;padding-bottom:3px}.day{min-height:60px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#0a1915;font-size:11px}.day.today{border-color:#38cf98;box-shadow:inset 0 0 0 1px #38cf9830}.day .dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block;margin-left:3px}
.mobile-nav{display:none}
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.62);backdrop-filter:blur(12px);display:none;align-items:flex-end;justify-content:center;padding:14px}.modal.open{display:flex}.sheet{width:min(620px,100%);background:#0c1c16;border:1px solid #294b3d;border-radius:25px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.5)}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.sheet h3{margin:0}.close{border:0;background:#13251e;color:#cfe3db;border-radius:10px;width:34px;height:34px}
.toast{position:fixed;z-index:120;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#e8fff5;color:#073522;padding:11px 15px;border-radius:13px;font-size:12px;font-weight:750;opacity:0;pointer-events:none;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1050px){.sidebar{width:220px}.main{margin-left:220px}.grid4{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.quick{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){
 body{background:linear-gradient(180deg,#07110e,#091511)}
 .sidebar{display:none}.main{margin:0;padding:14px 13px calc(88px + env(safe-area-inset-bottom))}
 .topbar{margin-bottom:15px}.topbar h1{font-size:21px}.topbar p{font-size:11px}.actions .datebtn{display:none}
 .hero{min-height:0;padding:21px;border-radius:24px;margin-bottom:11px}.hero h2{font-size:29px;margin-top:8px}.hero p{font-size:12px}.hero-actions{margin-top:16px}
 .grid4{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:11px}.stat{padding:12px;border-radius:17px}.stat strong{font-size:21px}
 .columns,.page-grid{display:block}.card{padding:15px;border-radius:20px;margin-bottom:11px}.quick{grid-template-columns:repeat(2,1fr)}
 .focus-row{align-items:flex-start}.focus .primary{white-space:nowrap}.calendar{gap:4px}.day{min-height:49px;padding:6px;font-size:10px}
 .form-grid{grid-template-columns:1fr}.mobile-nav{display:flex;position:fixed;z-index:50;left:9px;right:9px;bottom:8px;padding:7px 5px calc(7px + env(safe-area-inset-bottom));border:1px solid #244337;border-radius:21px;background:rgba(9,22,17,.92);backdrop-filter:blur(22px);box-shadow:0 16px 45px rgba(0,0,0,.45);justify-content:space-around}
 .mobile-nav button{border:0;background:transparent;color:#71867d;font-size:9px;min-width:48px;padding:3px}.mobile-nav button.active{color:var(--green);font-weight:800}.mobile-nav svg{width:19px;height:19px;display:block;margin:0 auto 3px}
 .modal{padding:8px}.sheet{border-radius:22px}.toast{bottom:105px}
}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">
    <div class="leaf"><svg viewBox="0 0 24 24" fill="none"><path d="M20.7 3.3C11.2 3.8 5.4 7.1 4.2 13.1c-.7 3.5 1.7 6.1 5.1 5.7 5.9-.7 8.7-6.8 8.7-11.1" stroke="white" stroke-width="2" stroke-linecap="round"/><path d="M4 21c3-5 7-7.5 12-9.5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div><b>Lifestyle OS</b><small>Ton système de vie</small></div>
  </div>
  <div class="nav-title">Mon espace</div>
  <nav class="nav" id="sideNav"></nav>
  <div class="sidebar-bottom">Lifestyle OS · local-first<br>Version design premium</div>
</aside>

<main class="main">
  <header class="topbar">
    <div><h1 id="pageTitle">Bonjour 👋</h1><p id="pageSub">Ton cockpit personnel, simple et clair.</p></div>
    <div class="actions">
      <button class="datebtn" id="todayBtn">Aujourd’hui</button>
      <button class="iconbtn" id="themeBtn" aria-label="Changer le thème">☼</button>
      <div class="avatar">A</div>
    </div>
  </header>
  <section id="page"></section>
</main>
<nav class="mobile-nav" id="mobileNav"></nav>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head"><h3 id="modalTitle">Ajouter</h3><button class="close" id="modalClose">×</button></div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const ICONS={
  Accueil:'<svg viewBox="0 0 24 24" fill="none"><path d="M3 11.5 12 4l9 7.5v8a1.5 1.5 0 0 1-1.5 1.5h-5v-6h-5v6h-5A1.5 1.5 0 0 1 3 19.5v-8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  Tâches:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="m8 12 2.5 2.5L16 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  Objectifs:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>',
  Agenda:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="5" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 3v4M16 3v4M4 9h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  Finances:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16v12H4z" stroke="currentColor" stroke-width="1.8"/><path d="M7 7V5h10v2M15 13h5" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="13" r="2" stroke="currentColor" stroke-width="1.5"/></svg>',
  Carrière:'<svg viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="13" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M9 7V5h6v2M8 12h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  Santé:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 20s-7-4.4-8.5-9.2C2.2 6.5 7.5 3.5 12 7.3c4.5-3.8 9.8-.8 8.5 3.5C19 15.6 12 20 12 20Z" stroke="currentColor" stroke-width="1.8"/></svg>',
  Loisirs:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 17.5c-2.2-1.4-2.8-4.1-1.1-6.2 1.5-1.9 4.1-2.2 6-.8 1.8-1.4 4.5-1.1 6 .8 1.7 2.1 1.1 4.8-1.1 6.2" stroke="currentColor" stroke-width="1.8"/><path d="M8 17.5h8M10 10V7m4 3V7M8 7h2m4 0h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  'Vie sociale':'<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="10" r="2.3" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 19c.6-3 2.5-4.5 5.5-4.5s4.9 1.5 5.5 4.5M14 15.5c2.7-.2 4.8 1 5.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  Spiritualité:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 4v16M7 9h10M8.5 20h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  Documents:'<svg viewBox="0 0 24 24" fill="none"><path d="M6 3.5h8l4 4V20.5H6z" stroke="currentColor" stroke-width="1.8"/><path d="M14 3.5v4h4M9 12h6M9 15.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
};
const NAV=['Accueil','Tâches','Objectifs','Agenda','Finances','Carrière','Santé','Loisirs','Vie sociale','Spiritualité','Documents'];
const KEY='LifestyleOS_Premium_Design_V1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
 tasks:[{id:'t1',name:'Faire du sport',space:'Santé',done:false},{id:'t2',name:'Réviser la comptabilité',space:'Carrière',done:false},{id:'t3',name:'Planifier la semaine',space:'Organisation',done:true}],
 goals:[{id:'g1',name:'Travailler en tant qu’AS',progress:25},{id:'g2',name:'Développer mes connaissances en économie',progress:35},{id:'g3',name:'Investir régulièrement',progress:20}],
 events:[], expenses:[], income:1119, bred:600, revolut:519,
 health:{weight:95,target:85,workouts:0}, leisure:[], contacts:[], spiritual:{minutes:0,days:0}, files:[]
};
function $(id){return document.getElementById(id)}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function euro(v){return Number(v||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function dateText(){return new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date())}
function buildNav(){
  const side=$('sideNav'), mob=$('mobileNav'); side.innerHTML='';mob.innerHTML='';
  NAV.forEach((n,i)=>{
    const b=document.createElement('button');b.dataset.page=n;b.innerHTML=ICONS[n]+'<span>'+n+'</span>';b.onclick=()=>show(n);side.appendChild(b);
    if(i<5||n==='Documents'){const m=document.createElement('button');m.dataset.page=n;m.innerHTML=ICONS[n]+'<span>'+n+'</span>';m.onclick=()=>show(n);mob.appendChild(m)}
  });
}
function activate(n){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===n))}
function show(n){
  activate(n);$('pageTitle').textContent=n==='Accueil'?'Bonjour 👋':n;$('pageSub').textContent=n==='Accueil'?'Ton cockpit personnel, simple et clair.':'Ton espace '+n.toLowerCase()+'.';
  if(n==='Accueil')home();else if(n==='Tâches')tasks();else if(n==='Objectifs')goals();else if(n==='Agenda')agenda();else if(n==='Finances')finance();else if(n==='Carrière')career();else if(n==='Santé')health();else if(n==='Loisirs')leisure();else if(n==='Vie sociale')social();else if(n==='Spiritualité')spiritual();else docs();
  window.scrollTo({top:0,behavior:'smooth'});
}
function stats(){
 return `<div class="grid4">
  <div class="stat"><div class="mini"><span>Tâches</span>${ICONS['Tâches']}</div><strong>${data.tasks.filter(x=>!x.done).length}</strong><span>à faire</span></div>
  <div class="stat"><div class="mini"><span>Objectifs</span>${ICONS.Objectifs}</div><strong>${data.goals.length}</strong><span>en cours</span></div>
  <div class="stat"><div class="mini"><span>Agenda</span>${ICONS.Agenda}</div><strong>${data.events.length}</strong><span>événements</span></div>
  <div class="stat"><div class="mini"><span>Revenus</span>${ICONS.Finances}</div><strong>${euro(data.income)}</strong><span>mensuels</span></div>
 </div>`;
}
function home(){
 const active=data.tasks.filter(x=>!x.done).slice(0,5);
 $('page').innerHTML=`
 <section class="hero"><div class="hero-content">
   <div class="eyebrow">${dateText()}</div>
   <h2>Construis une vie qui te ressemble, <span>un jour à la fois.</span></h2>
   <p>Lifestyle OS rassemble ton organisation, tes objectifs, tes finances, ta santé et tes projets dans un seul cockpit.</p>
   <div class="hero-actions"><button class="primary" onclick="openTask()">+ Nouvelle tâche</button><button class="secondary" onclick="show('Objectifs')">Voir mes objectifs</button></div>
 </div></section>
 ${stats()}
 <div class="columns">
  <div class="stack">
   <div class="card"><div class="card-head"><div><h3>Accès rapides</h3><p>Les espaces que tu utilises le plus.</p></div></div>
    <div class="quick">${[['Tâches','Organiser'],['Objectifs','Progresser'],['Agenda','Planifier'],['Finances','Piloter'],['Santé','Bouger'],['Loisirs','Profiter'],['Vie sociale','Entretenir'],['Spiritualité','Grandir']].map(([n,s])=>`<button onclick="show('${n}')"><div class="qicon">${ICONS[n]}</div><b>${n}</b><small>${s}</small></button>`).join('')}</div>
   </div>
   <div class="card"><div class="card-head"><div><h3>À faire maintenant</h3><p>Garde ton attention sur l’essentiel.</p></div><button class="link" onclick="show('Tâches')">Tout voir</button></div>
    ${active.length?active.map(x=>`<div class="task"><button class="check" onclick="toggleTask('${x.id}')"></button><div><div class="task-name">${esc(x.name)}</div><div class="task-meta">${esc(x.space||'Général')}</div></div></div>`).join(''):'<div class="empty">Tout est à jour. Profite de ton avance.</div>'}
   </div>
   <div class="card focus"><div class="focus-row"><div><h3>Focus du moment</h3><p>Choisis un domaine et lance une session.</p></div><button class="primary" onclick="startFocus()">▶ Démarrer</button></div>
    <div class="chips"><span class="chip">💼 Travail</span><span class="chip">🎓 Études</span><span class="chip">🏋️ Sport</span><span class="chip">📖 Lecture</span><span class="chip">💡 Projet perso</span></div>
   </div>
  </div>
  <div class="stack">
   <div class="card"><div class="card-head"><div><h3>Objectifs</h3><p>Ton cap actuel.</p></div><button class="link" onclick="show('Objectifs')">Ouvrir</button></div>
    ${data.goals.slice(0,4).map(g=>`<div class="goal"><div class="goal-top"><b>${esc(g.name)}</b><small>${g.progress||0}%</small></div><div class="progress"><i style="width:${g.progress||0}%"></i></div></div>`).join('')||'<div class="empty">Ajoute ton premier objectif.</div>'}
   </div>
   <div class="card"><div class="card-head"><div><h3>Finances</h3><p>Vue rapide du mois.</p></div><button class="link" onclick="show('Finances')">Ouvrir</button></div>
    <div class="finance-line"><span>Revenus</span><strong class="positive">${euro(data.income)}</strong></div>
    <div class="finance-line"><span>BRED</span><strong>${euro(data.bred)}</strong></div>
    <div class="finance-line"><span>Revolut</span><strong>${euro(data.revolut)}</strong></div>
    <div class="quote">“La clarté financière commence par une bonne visibilité.”</div>
   </div>
   <div class="card"><div class="card-head"><div><h3>Santé & bien-être</h3><p>Ton suivi essentiel.</p></div><button class="link" onclick="show('Santé')">Ouvrir</button></div>
    <div class="finance-line"><span>Poids actuel</span><strong>${data.health.weight} kg</strong></div>
    <div class="finance-line"><span>Objectif</span><strong>${data.health.target} kg</strong></div>
    <div class="finance-line"><span>Séances enregistrées</span><strong>${data.health.workouts}</strong></div>
   </div>
  </div>
 </div>`;
}
function tasks(){
 $('page').innerHTML=`<div class="hero" style="min-height:170px"><div class="hero-content"><div class="eyebrow">Organisation</div><h2>Mes tâches, <span>une chose après l'autre.</span></h2><p>Concentre-toi sur ce qui doit réellement avancer aujourd'hui.</p></div></div><div class="card"><div class="card-head"><div><h3>Mes tâches</h3><p>Simple, visible, actionnable.</p></div><button class="primary" onclick="openTask()">+ Ajouter</button></div>
 ${data.tasks.map(x=>`<div class="task ${x.done?'done':''}"><button class="check ${x.done?'done':''}" onclick="toggleTask('${x.id}')">${x.done?'✓':''}</button><div style="flex:1"><div class="task-name">${esc(x.name)}</div><div class="task-meta">${esc(x.space||'Général')}</div></div><button class="link" onclick="deleteTask('${x.id}')">Supprimer</button></div>`).join('')||'<div class="empty">Aucune tâche. Commence par une petite action.</div>'}</div>`;
}
function goals(){
 $('page').innerHTML=`<div class="hero" style="min-height:170px"><div class="hero-content"><div class="eyebrow">Direction</div><h2>Mes objectifs, <span>mon cap.</span></h2><p>Transforme tes ambitions en étapes visibles et mesurables.</p></div></div><div class="card"><div class="card-head"><div><h3>Objectifs</h3><p>Transforme tes projets en étapes visibles.</p></div><button class="primary" onclick="openGoal()">+ Ajouter</button></div>
 ${data.goals.map(g=>`<div class="goal" style="padding:16px 0"><div class="goal-top"><b>${esc(g.name)}</b><small>${g.progress||0}%</small></div><div class="progress"><i style="width:${g.progress||0}%"></i></div><div class="form-actions"><button class="secondary" onclick="incGoal('${g.id}')">+10%</button><button class="link" onclick="deleteGoal('${g.id}')">Supprimer</button></div></div>`).join('')||'<div class="empty">Aucun objectif enregistré.</div>'}</div>`;
}
function agenda(){
 const now=new Date(), y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1).getDay(), offset=(first+6)%7, days=new Date(y,m+1,0).getDate();
 let cells=['L','M','M','J','V','S','D'].map(x=>`<div class="calhead">${x}</div>`).join('');
 for(let i=0;i<offset;i++)cells+='<div></div>';
 for(let d=1;d<=days;d++){const today=d===now.getDate();cells+=`<div class="day ${today?'today':''}"><b>${d}</b>${data.events.some(e=>+e.day===d)?'<span class="dot"></span>':''}</div>`}
 $('page').innerHTML=`<div class="page-grid"><div class="card"><div class="card-head"><div><h3>Agenda</h3><p>${new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'}).format(now)}</p></div><button class="primary" onclick="openEvent()">+ Événement</button></div><div class="calendar">${cells}</div></div><div class="card"><div class="card-head"><div><h3>Prochains événements</h3><p>Ton mois en un coup d’œil.</p></div></div>${data.events.map(e=>`<div class="list-item"><div class="row"><b>${esc(e.name)}</b><span>${e.day}/${m+1}</span></div><small>${esc(e.time||'')}</small></div>`).join('')||'<div class="empty">Aucun événement.</div>'}</div></div>`;
}
function finance(){
 const exp=data.expenses.reduce((a,x)=>a+(+x.amount||0),0), remain=data.income-exp;
 $('page').innerHTML=`<div class="hero" style="min-height:190px"><div class="hero-content">
   <div class="eyebrow">Pilotage financier</div>
   <h2>Maîtrise ton argent, <span>sans complexité.</span></h2>
   <p>Une vue claire de tes revenus, dépenses et soldes, sans afficher les statistiques générales de l'accueil.</p>
 </div></div>
 <div class="page-grid"><div class="card"><div class="card-head"><div><h3>Configuration</h3><p>Adapte les montants à ta réalité.</p></div></div><div class="form-grid"><div class="field"><label>Revenus mensuels</label><input id="fincome" type="number" value="${data.income}"></div><div class="field"><label>BRED</label><input id="fbred" type="number" value="${data.bred}"></div><div class="field"><label>Revolut</label><input id="frev" type="number" value="${data.revolut}"></div></div><div class="form-actions"><button class="primary" onclick="saveFinance()">Enregistrer</button></div></div>
 <div class="card"><div class="card-head"><div><h3>Ajouter une dépense</h3><p>Catégorise ce qui sort.</p></div></div><div class="field"><label>Libellé</label><input id="dname" placeholder="Ex. Carburant"></div><div class="form-grid" style="margin-top:10px"><div class="field"><label>Montant</label><input id="damt" type="number" placeholder="0"></div><div class="field"><label>Catégorie</label><select id="dcat"><option>Loyer</option><option>Assurance voiture</option><option>Crédit voiture</option><option>Courses</option><option>Carburant</option><option>Frais bancaires</option><option>Autres dépenses</option></select></div></div><div class="form-actions"><button class="primary" onclick="addExpense()">Ajouter</button></div></div>
 <div class="card"><div class="card-head"><div><h3>Dépenses récentes</h3></div></div>${data.expenses.map((x,i)=>`<div class="finance-line"><div><span>${esc(x.name)}</span><br><small>${esc(x.cat)}</small></div><strong class="negative">− ${euro(x.amount)}</strong></div>`).join('')||'<div class="empty">Aucune dépense.</div>'}</div></div>`;
}
function career(){
 $('page').innerHTML=`<div class="page-grid"><div class="card"><div class="card-head"><div><h3>Carrière & études</h3><p>Un espace pour tes prochaines étapes.</p></div></div><div class="list-item"><b>Objectif professionnel</b><br><small>Suivre mes candidatures, formations et compétences.</small></div><div class="list-item"><b>Formation</b><br><small>BTS / développement de compétences</small></div><div class="quote" style="margin-top:10px">Ton parcours peut évoluer. Garde une trace de ce que tu construis.</div></div>
 <div class="card"><div class="card-head"><div><h3>Actions carrière</h3></div></div>${['Mettre à jour mon CV','Préparer une candidature','Suivre une formation','Développer une compétence'].map(x=>`<div class="task"><div class="check"></div><div><div class="task-name">${x}</div><div class="task-meta">Ajouter comme tâche pour la suivre</div></div><button class="link" onclick="addQuickTask('${x}')">+ Ajouter</button></div>`).join('')}</div></div>`;
}
function health(){
 $('page').innerHTML=`<div class="page-grid"><div class="card"><div class="card-head"><div><h3>Suivi physique</h3><p>Des indicateurs simples, sans surcharge.</p></div></div><div class="form-grid"><div class="field"><label>Poids actuel (kg)</label><input id="hweight" type="number" value="${data.health.weight}"></div><div class="field"><label>Objectif (kg)</label><input id="htarget" type="number" value="${data.health.target}"></div><div class="field"><label>Séances enregistrées</label><input id="hwork" type="number" value="${data.health.workouts}"></div></div><div class="form-actions"><button class="primary" onclick="saveHealth()">Enregistrer</button></div></div>
 <div class="card"><div class="card-head"><div><h3>Sports</h3><p>Les activités que tu peux suivre.</p></div></div><div class="chips"><span class="chip">Musculation</span><span class="chip">Muay Thai</span><span class="chip">Kayak</span><span class="chip">Course</span><span class="chip">Marche</span><span class="chip">Vélo</span><span class="chip">Natation</span></div><div class="quote" style="margin-top:12px">La régularité compte davantage qu’une journée parfaite.</div></div></div>`;
}
function leisure(){
 $('page').innerHTML=`<div class="page-grid"><div class="card"><div class="card-head"><div><h3>Loisirs & passions</h3><p>Ce qui donne de l’énergie à ta vie.</p></div><button class="primary" onclick="openLeisure()">+ Ajouter</button></div>${data.leisure.map(x=>`<div class="list-item"><b>${esc(x.name)}</b><br><small>${esc(x.type)}</small></div>`).join('')||'<div class="empty">Ajoute une passion ou un projet personnel.</div>'}</div><div class="card"><div class="card-head"><div><h3>Idées</h3></div></div>${['Kayak','Muay Thai','Guitare','Permis moto','Voyage','Activité extrême'].map(x=>`<div class="finance-line"><span>${x}</span><button class="link" onclick="addLeisure('${x}')">+ Ajouter</button></div>`).join('')}</div></div>`;
}
function social(){
 $('page').innerHTML=`<div class="page-grid"><div class="card"><div class="card-head"><div><h3>Vie sociale</h3><p>Entretenir les relations importantes.</p></div><button class="primary" onclick="openContact()">+ Contact</button></div>${data.contacts.map(x=>`<div class="list-item"><b>${esc(x.name)}</b><br><small>${esc(x.type)}</small></div>`).join('')||'<div class="empty">Aucun contact ajouté.</div>'}</div><div class="card"><div class="card-head"><div><h3>Petites actions</h3></div></div>${['Appeler un proche','Proposer une sortie','Envoyer un message','Planifier un moment ensemble'].map(x=>`<div class="task"><div class="check"></div><div class="task-name">${x}</div><button class="link" onclick="addQuickTask('${x}')">+ Tâche</button></div>`).join('')}</div></div>`;
}
function spiritual(){
 $('page').innerHTML=`<div class="page-grid"><div class="card"><div class="card-head"><div><h3>Spiritualité</h3><p>Un espace calme pour ta relation avec Dieu.</p></div></div><div class="form-grid"><div class="field"><label>Minutes / semaine</label><input id="pmin" type="number" value="${data.spiritual.minutes}"></div><div class="field"><label>Jours / semaine</label><input id="pdays" type="number" value="${data.spiritual.days}"></div></div><div class="form-actions"><button class="primary" onclick="saveSpiritual()">Enregistrer</button></div></div><div class="card"><div class="card-head"><div><h3>Pratiques</h3><p>Choisis ce qui te nourrit.</p></div></div><div class="chips"><span class="chip">Prière</span><span class="chip">Bible</span><span class="chip">Méditation</span><span class="chip">Gratitude</span><span class="chip">Réflexion</span><span class="chip">Église</span></div><div class="quote" style="margin-top:12px">Un petit temps régulier peut devenir un véritable repère.</div></div></div>`;
}
function docs(){
 $('page').innerHTML=`<div class="page-grid"><div class="card"><div class="card-head"><div><h3>Documents</h3><p>Une bibliothèque locale pour tes fichiers.</p></div></div><input id="fileLabel" class="search" placeholder="Libellé du document"><input id="fileInput" type="file" multiple style="margin:12px 0;width:100%"><button class="primary" onclick="addFiles()">Ajouter les fichiers</button></div><div class="card"><div class="card-head"><div><h3>Bibliothèque</h3><p>${data.files.length} fichier(s)</p></div></div>${data.files.map(x=>`<div class="list-item"><div class="row"><div><b>${esc(x.label||x.name)}</b><br><small>${esc(x.name)}</small></div><button class="link" onclick="openFile('${x.id}')">Ouvrir</button></div></div>`).join('')||'<div class="empty">Aucun document.</div>'}</div></div>`;
}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
$('modalClose').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()}
function openTask(){openModal('Nouvelle tâche',`<div class="field"><label>Tâche</label><input id="mtname" autofocus placeholder="Ex. Faire 30 min de sport"></div><div class="field" style="margin-top:10px"><label>Domaine</label><select id="mtspace"><option>Général</option><option>Santé</option><option>Carrière</option><option>Finances</option><option>Loisirs</option><option>Vie sociale</option><option>Spiritualité</option></select></div><div class="form-actions"><button class="primary" onclick="createTask()">Créer</button></div>`)}
function createTask(){const n=$('mtname').value.trim();if(!n)return;data.tasks.unshift({id:crypto.randomUUID(),name:n,space:$('mtspace').value,done:false});save();closeModal();show('Tâches');toast('Tâche ajoutée')}
function toggleTask(id){const x=data.tasks.find(a=>a.id===id);if(x){x.done=!x.done;save();show('Tâches');}}
function deleteTask(id){data.tasks=data.tasks.filter(x=>x.id!==id);save();show('Tâches')}
function addQuickTask(n){data.tasks.unshift({id:crypto.randomUUID(),name:n,space:'Général',done:false});save();toast('Tâche ajoutée');}
function openGoal(){openModal('Nouvel objectif',`<div class="field"><label>Objectif</label><input id="mgname" placeholder="Ex. Lire 12 livres"></div><div class="form-actions"><button class="primary" onclick="createGoal()">Créer</button></div>`)}
function createGoal(){const n=$('mgname').value.trim();if(!n)return;data.goals.push({id:crypto.randomUUID(),name:n,progress:0});save();closeModal();show('Objectifs');toast('Objectif ajouté')}
function incGoal(id){const x=data.goals.find(a=>a.id===id);if(x){x.progress=Math.min(100,(x.progress||0)+10);save();goals()}}
function deleteGoal(id){data.goals=data.goals.filter(x=>x.id!==id);save();goals()}
function openEvent(){openModal('Nouvel événement',`<div class="field"><label>Nom</label><input id="mename" placeholder="Ex. Rendez-vous"></div><div class="form-grid" style="margin-top:10px"><div class="field"><label>Jour du mois</label><input id="meday" type="number" min="1" max="31"></div><div class="field"><label>Heure</label><input id="metime" type="time"></div></div><div class="form-actions"><button class="primary" onclick="createEvent()">Créer</button></div>`)}
function createEvent(){const n=$('mename').value.trim();if(!n)return;data.events.push({id:crypto.randomUUID(),name:n,day:+$('meday').value||new Date().getDate(),time:$('metime').value});save();closeModal();agenda();toast('Événement ajouté')}
function saveFinance(){data.income=+$('fincome').value||0;data.bred=+$('fbred').value||0;data.revolut=+$('frev').value||0;save();finance();toast('Finances enregistrées')}
function addExpense(){const n=$('dname').value.trim(),a=+$('damt').value;if(!n||!a)return;data.expenses.unshift({id:crypto.randomUUID(),name:n,amount:a,cat:$('dcat').value});save();finance();toast('Dépense ajoutée')}
function saveHealth(){data.health.weight=+$('hweight').value||0;data.health.target=+$('htarget').value||0;data.health.workouts=+$('hwork').value||0;save();health();toast('Suivi enregistré')}
function openLeisure(){openModal('Ajouter un loisir',`<div class="field"><label>Activité / projet</label><input id="mlname" placeholder="Ex. Guitare"></div><div class="field" style="margin-top:10px"><label>Type</label><select id="mltype"><option>Loisir</option><option>Sport</option><option>Projet personnel</option><option>Voyage</option></select></div><div class="form-actions"><button class="primary" onclick="createLeisure()">Ajouter</button></div>`)}
function createLeisure(){const n=$('mlname').value.trim();if(!n)return;data.leisure.unshift({id:crypto.randomUUID(),name:n,type:$('mltype').value});save();closeModal();leisure();toast('Ajouté')}
function addLeisure(n){if(!data.leisure.some(x=>x.name===n)){data.leisure.unshift({id:crypto.randomUUID(),name:n,type:'Idée'});save();leisure();toast('Ajouté')}}
function openContact(){openModal('Ajouter un contact',`<div class="field"><label>Nom</label><input id="mcname" placeholder="Nom du contact"></div><div class="field" style="margin-top:10px"><label>Type</label><select id="mctype"><option>Famille</option><option>Amis</option><option>Collègue</option><option>Connaissance</option></select></div><div class="form-actions"><button class="primary" onclick="createContact()">Ajouter</button></div>`)}
function createContact(){const n=$('mcname').value.trim();if(!n)return;data.contacts.unshift({id:crypto.randomUUID(),name:n,type:$('mctype').value});save();closeModal();social();toast('Contact ajouté')}
function saveSpiritual(){data.spiritual.minutes=+$('pmin').value||0;data.spiritual.days=+$('pdays').value||0;save();spiritual();toast('Spiritualité enregistrée')}
function addFiles(){const files=$('fileInput').files;if(!files.length)return;let left=files.length;[...files].forEach(f=>{const r=new FileReader();r.onload=()=>{data.files.unshift({id:crypto.randomUUID(),name:f.name,label:$('fileLabel').value.trim()||f.name,data:r.result});if(--left===0){save();docs();toast('Fichiers ajoutés')}};r.readAsDataURL(f)})}
function openFile(id){const x=data.files.find(a=>a.id===id);if(!x)return;const a=document.createElement('a');a.href=x.data;a.target='_blank';a.download=x.name;a.click()}
function startFocus(){toast('Session de focus démarrée · 25 min')}
$('themeBtn').onclick=()=>{document.body.classList.toggle('light');toast('Le mode clair arrive dans une prochaine version')}
$('todayBtn').onclick=()=>{show('Accueil');toast(dateText())}
buildNav();show('Accueil');
</script>
</body>
</html>
